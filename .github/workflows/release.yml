name: Test, build and release
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-plugins
          path: dist/
      - name: Validate tag matches all plugin versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from build import ROOT_DIR, PLUGIN_CONFIGS, get_plugin_version; assert all('v' + get_plugin_version(ROOT_DIR / 'plugins' / k / '__init__.py') == '${{ github.ref_name }}' for k in PLUGIN_CONFIGS)"
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: calibre-plugins
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
