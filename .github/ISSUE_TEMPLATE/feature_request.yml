name: 기능 제안
description: 새 기능 또는 동작 개선을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 상황에서 불편한지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 적용할 서점과 예시 도서가 있다면 함께 적어주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용 중인 방법과 참고 자료
