<b>“필사, 그냥 베껴 쓰면 되는 거 아닌가요?”</b><br><b>“필사를 하면 진짜 어휘력이 좋아지나요?”</b><br><b>*어휘력을 끌어올리려 이제 막 필사를 시작하는 당신이 읽어야 할 단 한 권의 책*</b><br><br>최근 인공지능에 대한 관심이 뜨거워지면서 챗GPT를 활용하는 범위가 늘어나고 있다. 모바일 채팅봇의 기계적인 답변만 생각했다가, 막상 써보면 꽤 그럴싸한 언변과 뜻밖의 논리를 갖추고 있어 흠칫 놀라게 된다는 반응이 다수다. 알고 보면 크게 어려운 말도 없고, 뾰족한 메시지가 있는 것도 아닌데, 내가 하고 싶었던 말과 생각들을 그대로 읽어냈다는 느낌을 지울 수 없다. 몰라서 못 쓰는 것이 아니라 머리로는 알지만 어떻게 써야 할지 몰랐던 생각과 주장을 챗GPT가 술술 풀어내는 것을 보면서 그간의 어휘력과 문장력을 돌아보게 된다. 할 말은 많지만 쓸 만한 말이 없음을 실감하며, 전에 없던 다독 혹은 필사에 관심을 갖게 된다.<br><br>『하루 한 장 나의 어휘력을 위한 필사 노트』는 필사를 시작하거나 하고 있는 사람이라면 한 번쯤 던져보았을 질문을 해소하는 데서 출발한다. 단순히 책 한 권을 베껴 쓰는 통 필사의 개념이 아닌, 그 이상의 효용을 끌어내기 위한 구체적인 방법들을 단계별로 제시한다. 소설, 시, 산문, 희곡 등 일상에서 흔히 읽기 어려운 다양한 작품들을 마주할 기회를 제공하는데, 특히 저자가 엄선하여 고른 본문 속 작품들은 눈으로 읽어도 좋지만 집중해서 천천히 손으로 필사할 때 더욱 각별한 ‘울림’이 있다. ‘어휘와 친해지는 법’, ‘어휘력을 기르는 비결’, ‘어휘가 주는 힘’ 등 어휘력을 끌어올리는 구체적인 방법을 제시하며 동시에 자신의 목적에 더 부합한 필사를 심화할 수 있도록 돕는다. 그 외 새롭게 읽고 필사한 문장에서 발견한 어휘를 재료로 자기만의 글쓰기를 할 수 있는 지면도 마련되어 있고, 각주에 달린 유의어 등을 본문에 대입해 읽다 보면 그간 놓치고 있던 ‘말맛’도 세세하게 느낄 수 있다.<br><br><b>‘쓰지 않는 말들은 결국 쓸 수 없는 말들이다’</b><br><b>- 내 안의 숨은 어휘력을 찾아줄 134편의 실용적인 글쓰기, 필사</b><br><br>우리가 살아가는 데 필요한 기본 어휘는 읽고, 표현하는 데 문제가 없으면 충분한 게 사실이다. 하지만 자세히 들여다보면 일상에서 주고받는 말과 글은 생각보다 다채롭지 않다. 비슷하 단어들과 형식적인 내용만 반복적으로 오간다. 그러다 보니 새로운 것을 듣고 익혀 나의 언어를 풍성하게 만들 기회가 부족하다. 빈약한 어휘는 나의 생각과 감정을 효과적으로 표현하지 못하고, 정보와 지식을 해석하는 면에서도 뒤처지는 원인이 된다.<br><br>이 책은 풍성한 언어 구사력과 빠른 문해력에 목말라 있던 사람들을 위해 유선경 작가가 자신의 독서 경험과 필사 노하우를 결합해 만든 최초의 어휘력 필사책이다. 하루 한 장, 10분 남짓의 글쓰기를 통해 그동안 쓰지 않던 말을 꺼내어 쓸 수 있게 돕는다. 몰라서 못 쓴 것이 아니라 알고 있었지만 쓰일 기회가 적었던 표현이나 어휘를 익혀 비로소 내 것으로 만들어 준다.<br><br>우리는 경험한 것만 알 수 있고, 그 외의 것은 미지의 영역이다. 언어도 마찬가지다. 결국 내가 쓰지 않는 말들은 쓸 수 없는 말이다. 쓰지 않는 말의 영역이 줄어들고, 쓸 수 있는 말이 점점 늘어날 때, 공적인 글쓰기뿐만 아니라 일상적인 대화에서도 나의 어휘력과 문장력이 한 결 넓어졌음을 체감하게 된다. 또한 낯선 문학 작품이나 생소한 어휘를 익히려 시작한 필사가 마음의 운동이 되고 명상이 되는 효과까지 두루 경험할 수 있어 ‘어른의 교양’을 위한 공부로도 손색이 없다.<br><br>이 책을 통해 계속해서 쓰는 사람, 가볍지만 꾸준하게 하루 한 장이라도 읽고 쓰는 기쁨을 맛본다면 필사의 기쁨과 나를 위한 공부의 효용을 체감하게 될 것이다. 그때는 부러 움직이지 않아도 책상에 노트와 펜을 들고 앉아 이 시간을 기다리는 자신과 마주하게 될 것이다. 그것이 바로 루틴의 힘이니까.                        </textarea>
